name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/payroll-generation-system-ls9t4i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build sito protetto da password (AES-256, StatiCrypt)
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PAGES_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "::error::Manca il secret PAGES_PASSWORD: Settings -> Secrets and variables -> Actions -> New repository secret (nome PAGES_PASSWORD, valore = password di accesso al sito)."
            exit 1
          fi
          node build-protetto.js
          # --short: accetta password sotto i 14 caratteri senza chiedere conferma
          # interattiva, che in CI non potrebbe essere data e farebbe fallire il job.
          npx --yes staticrypt dist/index.html -d dist-enc --short --remember 30 \
            --template-title "BustaPaga — Accesso riservato" \
            --template-instructions "Inserire la password per accedere al sistema" \
            --template-button "Entra" < /dev/null
          test -s dist-enc/index.html || { echo "::error::Cifratura non riuscita: dist-enc/index.html non generato."; exit 1; }
          echo "Pagina cifrata generata:" && ls -la dist-enc/
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Carica sito cifrato
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist-enc'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
